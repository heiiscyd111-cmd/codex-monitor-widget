<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;color:#eef2ff}
body{padding:0}.tip{position:relative;height:100%;padding:8px 10px 7px;border-radius:11px;background:linear-gradient(145deg,#111a2d 0%,#080e1c 72%);overflow:hidden}.tip:before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(139,124,255,.3);pointer-events:none}.tip:after{content:"";position:absolute;width:54px;height:54px;right:-22px;top:-30px;border-radius:50%;background:rgba(139,124,255,.14);filter:blur(8px);pointer-events:none}.title{position:relative;display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10.5px;font-weight:600;color:#aeb9d2;letter-spacing:.15px}.title:before{content:"";width:5px;height:5px;border-radius:50%;background:#8d7cff;box-shadow:0 0 7px rgba(141,124,255,.75)}#detail{position:relative;display:grid;gap:1px}.row{display:grid;grid-template-columns:14px 1fr;align-items:center;font-size:12.5px;font-weight:550;line-height:1.28;color:#eef2ff;font-variant-numeric:tabular-nums}.num{color:#7f8ca8;font-size:11px}.time{letter-spacing:.1px}.row.empty{grid-template-columns:1fr}.row.empty .num{display:none}.row.empty .time{color:#aeb9d2;font-size:11.5px}
</style>
</head>
<body><div class="tip"><div class="title">后续预测窗口</div><div id="detail"><div class="row"><span class="num">·</span><span class="time">正在读取…</span></div></div></div>
<script>window.codexWidget.onTooltip(text=>{const detail=document.getElementById("detail");const lines=String(text||"").split(/\r?\n/).filter(Boolean);detail.innerHTML="";lines.forEach((line,index)=>{const row=document.createElement("div");row.className="row";const match=line.match(/^\s*\d+[.、]\s*(.*)$/);if(!match)row.classList.add("empty");const num=document.createElement("span");num.className="num";num.textContent=match?String(index+1).padStart(2,"0"):"";const time=document.createElement("span");time.className="time";time.textContent=match?match[1]:line;row.append(num,time);detail.append(row)})})</script>
</body>
</html>
