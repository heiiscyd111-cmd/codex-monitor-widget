<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;color:#eef2ff}
body{padding:0}.tip{position:relative;height:100%;padding:8px 10px 7px;border-radius:11px;background:linear-gradient(145deg,#111a2d 0%,#080e1c 72%);overflow:hidden}.tip:before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(139,124,255,.3);pointer-events:none}.tip:after{content:"";position:absolute;width:54px;height:54px;right:-22px;top:-30px;border-radius:50%;background:rgba(139,124,255,.14);filter:blur(8px);pointer-events:none}.title{position:relative;display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:10.5px;font-weight:600;color:#aeb9d2;letter-spacing:.15px}.title:before{content:"";width:5px;height:5px;border-radius:50%;background:#8d7cff;box-shadow:0 0 7px rgba(141,124,255,.75)}#detail{position:relative;display:grid;gap:1px}.row{display:grid;grid-template-columns:14px 1fr;align-items:center;font-size:12.5px;font-weight:550;line-height:1.28;color:#eef2ff;font-variant-numeric:tabular-nums}.num{color:#7f8ca8;font-size:11px}.time{letter-spacing:.1px}.row.empty{grid-template-columns:1fr}.row.empty .num{display:none}.row.empty .time{color:#aeb9d2;font-size:11.5px}.usage-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:1px 0 7px}.metric{padding:6px 7px 5px;border-radius:8px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.055)}.metric-label{font-size:8.5px;color:#8390aa;margin-bottom:2px}.metric-value{font-size:12px;font-weight:720;color:#f1f4ff;font-variant-numeric:tabular-nums;white-space:nowrap}.model-head{display:flex;align-items:center;gap:6px;color:#8996b1;font-size:8.5px;margin:0 1px 3px}.model-head:after{content:"";height:1px;background:rgba(255,255,255,.07);flex:1}.model-list{display:grid;gap:1px}.model-row{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:17px;font-size:10.5px}.model-dot{width:5px;height:5px;border-radius:50%;background:#8d7cff;box-shadow:0 0 6px rgba(141,124,255,.5)}.model-row:nth-child(2) .model-dot{background:#6ea8ff}.model-row:nth-child(3) .model-dot{background:#69d2c8}.model-row:nth-child(n+4) .model-dot{background:#aeb9d2}.model-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9d2e7}.model-value{color:#eef2ff;font-weight:650;font-variant-numeric:tabular-nums}.empty-model{font-size:10px;color:#8390aa;padding-top:2px}
</style>
</head>
<body><div class="tip"><div class="title" id="tipTitle">后续预测窗口</div><div id="detail"><div class="row"><span class="num">·</span><span class="time">正在读取…</span></div></div></div>
<script>
const compactToken=n=>{n=Number(n||0);if(n>=1e6)return (n/1e6).toFixed(2).replace(/0+$/,"").replace(/\.$/,"")+"M";if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";return n.toLocaleString("zh-CN")};
const prettyModel=name=>String(name||"未知模型").replace(/^gpt-/i,"GPT-").replace(/-(sol|luna|terra)$/i,(_,suffix)=>" "+suffix[0].toUpperCase()+suffix.slice(1).toLowerCase());
window.codexWidget.onTooltip(payload=>{
  const data=typeof payload==="string"?{title:"后续预测窗口",text:payload}:payload||{};
  document.getElementById("tipTitle").textContent=data.title||"详情";
  const detail=document.getElementById("detail");
  detail.innerHTML="";
  if(data.kind==="weekly"){
    const summary=document.createElement("div");summary.className="usage-summary";
    [["今日",data.dailyTokens],["本周",data.weeklyTokens]].forEach(([label,value])=>{const metric=document.createElement("div");metric.className="metric";metric.innerHTML=`<div class="metric-label">${label} TOKEN</div><div class="metric-value">${compactToken(value)}</div>`;summary.append(metric)});
    detail.append(summary);
    const head=document.createElement("div");head.className="model-head";head.textContent="模型明细";detail.append(head);
    const list=document.createElement("div");list.className="model-list";
    const models=Array.isArray(data.models)?data.models:[];
    if(!models.length){const empty=document.createElement("div");empty.className="empty-model";empty.textContent="暂无模型用量记录";list.append(empty)}
    models.forEach(item=>{const row=document.createElement("div");row.className="model-row";const dot=document.createElement("i");dot.className="model-dot";const name=document.createElement("span");name.className="model-name";name.textContent=prettyModel(item.model);const value=document.createElement("span");value.className="model-value";value.textContent=compactToken(item.tokens);row.append(dot,name,value);list.append(row)});
    detail.append(list);return;
  }
  const lines=String(data.text||"").split(/\r?\n/).filter(Boolean);
  lines.forEach((line,index)=>{const row=document.createElement("div");row.className="row";const match=line.match(/^\s*\d+[.、]\s*(.*)$/);if(!match)row.classList.add("empty");const num=document.createElement("span");num.className="num";num.textContent=match?String(index+1).padStart(2,"0"):"";const time=document.createElement("span");time.className="time";time.textContent=match?match[1]:line;row.append(num,time);detail.append(row)});
});
</script>
</body>
</html>
