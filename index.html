<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 状态</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf0ff;overflow:hidden}
body{padding:6px;background:transparent}
.card{height:100%;border:0;border-radius:16px;background:linear-gradient(145deg,rgba(16,24,42,.98),rgba(7,12,24,.97));box-shadow:none;overflow:hidden;position:relative;display:flex;align-items:stretch}
.card:before{display:none}
.top{width:88px;margin:0;padding:10px 9px;display:flex;align-items:center;justify-content:center;-webkit-app-region:drag;border:0;border-right:1px solid rgba(255,255,255,.08);border-radius:0;background:transparent;box-shadow:none;flex:0 0 auto}
.logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#fff,#b6c5ff);color:#121827;display:grid;place-items:center;font-size:15px;font-weight:900;box-shadow:0 5px 20px rgba(164,183,255,.25)}
.name{font-size:14px;font-weight:750;letter-spacing:.2px}.plan{font-size:9px;color:#9eabc5;text-transform:uppercase;margin-top:1px}
.spacer{flex:1}.icon-btn{border:0;background:transparent;color:#8f9bb5;font-size:16px;width:23px;height:23px;border-radius:7px;cursor:pointer;-webkit-app-region:no-drag}.icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.top .logo,.top .spacer,.top .icon-btn{display:none}.brand{text-align:center}.brand-sub{font-size:8px;color:#aaa3d9;margin-top:5px;letter-spacing:.7px}.content{padding:0;display:flex;align-items:stretch;gap:0;min-width:0;flex:1}.task,.footer{display:none!important}.status-tail{width:46px;display:grid;place-items:center;flex:0 0 46px}.status-orb{width:14px;height:14px;border-radius:50%;background:#64748b;box-shadow:0 0 0 5px rgba(100,116,139,.1);transition:all .25s}.status-orb.running{background:#22c55e;box-shadow:0 0 0 5px rgba(34,197,94,.13),0 0 16px rgba(34,197,94,.3);animation:pulse 1.4s infinite}
.usage{height:auto;display:flex;align-items:stretch;gap:0;padding:0;border-radius:0;background:transparent;border:0;border-right:1px solid rgba(255,255,255,.08);box-shadow:none;flex:1}.quota{display:flex;align-items:center;gap:7px;min-width:0;flex:1;padding:7px 10px}.quota+.quota{border-left:1px solid rgba(255,255,255,.08)}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:transparent;display:grid;place-items:center;position:relative;flex:0 0 auto}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg);shape-rendering:geometricPrecision}.ring-progress{fill:none;stroke:#8d7cff;stroke-width:5;stroke-linecap:round;stroke-dasharray:calc(var(--p)*1) 100;transition:stroke-dasharray .4s ease;vector-effect:non-scaling-stroke}.ring:before,.ring:after{display:none}.ring-value{z-index:1;text-align:center}.percent{font-size:14px;font-weight:760;line-height:1;letter-spacing:-.7px;color:#f4f2ff}.left{font-size:7px;color:#aaa3d9;margin-top:3px;letter-spacing:.4px}
.usage-copy{min-width:0;flex:1}.usage-title{font-size:9px;color:#98a5be}.reset{font-size:9px;font-weight:650;margin-top:3px;line-height:1.35;white-space:pre-line;color:#dce4f5}.bar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:9px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7062fb,#b08cff);border-radius:99px;transition:width .4s}
.task{height:auto;margin-top:0;padding:10px 12px;border-radius:0;background:transparent;border:0;border-right:1px solid rgba(255,255,255,.08);box-shadow:none;cursor:pointer;min-width:145px;flex:1}
.task:hover{background:rgba(255,255,255,.06)}.status-row{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}.dot.running{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12);animation:pulse 1.4s infinite}.status{font-size:11px;font-weight:700}.time{margin-left:auto;font-size:10px;color:#7f8ca6}.task-title{font-size:11px;font-weight:650;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:10px;margin-top:5px;color:#7f8ca6;font-size:9px}
.footer{height:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-top:0;color:#8f9bb5;font-size:9px;line-height:1.5;text-align:center;flex:0 0 72px;gap:0;border:0;border-radius:0;background:transparent;box-shadow:none}.open{display:none;border:0;border-radius:8px;background:rgba(124,108,255,.16);color:#c6beff;padding:5px 9px;font-size:9px;cursor:pointer}.open:hover{background:rgba(124,108,255,.28)}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}.muted{color:#7f8ca6}
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <div class="logo">C</div>
    <div class="brand"><div class="name" id="plan">Codex</div><div class="brand-sub">可用额度</div></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refresh" title="刷新">↻</button>
    <button class="icon-btn" id="close" title="隐藏">×</button>
  </header>
  <section class="content">
    <div class="usage">
      <div class="quota quota-week" id="weekQuota">
        <div class="ring" id="weekRing"><svg class="ring-svg" viewBox="0 0 44 44" aria-hidden="true"><circle class="ring-progress" cx="22" cy="22" r="18.5" pathLength="100"/></svg><div class="ring-value"><div class="percent" id="weekPercent">--</div></div></div>
        <div class="usage-copy"><div class="usage-title">本周额度</div><div class="reset" id="weekReset">读取中…</div></div>
      </div>
      <div class="quota quota-five" id="fiveQuota">
        <div class="ring" id="fiveRing"><svg class="ring-svg" viewBox="0 0 44 44" aria-hidden="true"><circle class="ring-progress" cx="22" cy="22" r="18.5" pathLength="100"/></svg><div class="ring-value"><div class="percent" id="fivePercent">--</div></div></div>
        <div class="usage-copy"><div class="usage-title">5 小时额度</div><div class="reset" id="fiveReset">读取中…</div></div>
      </div>
    </div>
    <div class="task" id="task">
      <div class="status-row"><i class="dot" id="dot"></i><span class="status" id="status">检查状态中</span><span class="time" id="elapsed"></span></div>
      <div class="task-title" id="taskTitle">正在读取最近任务…</div>
      <div class="meta"><span id="model"></span><span id="tokens"></span><span id="updated"></span></div>
    </div>
    <div class="footer"><span id="appState">Codex 状态检查中</span><button class="open" id="openCodex">打开 Codex</button></div>
    <div class="status-tail" id="statusTail" title="运行完成"><i class="status-orb" id="tailDot"></i></div>
  </section>
</main>
<script>
let snapshot=null;
const $=id=>document.getElementById(id);
function compact(n){if(!n)return "";if(n>=1e6)return (n/1e6).toFixed(1)+"M tokens";if(n>=1e3)return Math.round(n/1e3)+"K tokens";return n+" tokens"}
function ago(ms){if(!ms)return "";const s=Math.max(0,Math.floor((Date.now()-ms)/1000));if(s<60)return s+" 秒前";if(s<3600)return Math.floor(s/60)+" 分钟前";return Math.floor(s/3600)+" 小时前"}
function duration(ms){if(!ms)return "";const s=Math.max(0,Math.floor((Date.now()-ms)/1000));const m=Math.floor(s/60),h=Math.floor(m/60);return h?h+"时"+m%60+"分":m?m+"分"+s%60+"秒":s+"秒"}
function countdown(ms){if(!ms)return "暂无重置时间";const dt=new Date(ms),date=dt.toLocaleDateString("zh-CN",{month:"long",day:"numeric"}),time=dt.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false});let d=Math.max(0,ms-Date.now()),days=Math.floor(d/86400000);d%=86400000;let h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);return date+" "+time+" 重置\n"+(days?days+"天 ":"")+h+"时"+m+"分"}
function clock(ms){return new Date(ms).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false})}
function remainingTime(ms){let d=Math.max(0,ms-Date.now()),h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);return h+"时"+m+"分"}
function fiveHourSummary(quota){if(!quota||!quota.resetsAt)return "未提供";const span=5*60*60*1000,end=quota.resetsAt,start=end-span;return "本轮 "+clock(start)+"–"+clock(end)+"\n"+remainingTime(end)+"后重置"}
function predictedWindow(a,b){return clock(a)+"–"+clock(b)}
function fiveHourDetails(quota){if(!quota||!quota.resetsAt)return "今日暂无后续窗口";const span=5*60*60*1000,end=quota.resetsAt,next=[],tomorrow=new Date();tomorrow.setHours(24,0,0,0);for(let a=end;a<tomorrow.getTime();a+=span){next.push((next.length+1)+". "+predictedWindow(a,a+span))}return next.length?next.join("\n"):"今日暂无后续窗口"}
function tokenCount(n){return Number(n||0).toLocaleString("zh-CN")+" tokens"}
function weeklyTooltip(s){return {title:"本周用量",kind:"weekly",dailyTokens:Number(s&&s.dailyTokens||0),weeklyTokens:Number(s&&s.weeklyTokens||0),models:s&&Array.isArray(s.weeklyModelUsage)?s.weeklyModelUsage:[]}}
function renderQuota(prefix,quota){const remain=quota&&quota.remainingPercent;$(prefix+"Percent").textContent=remain==null?"--":Math.round(remain)+"%";$(prefix+"Ring").style.setProperty("--p",remain||0);$(prefix+"Reset").textContent=prefix==="five"?fiveHourSummary(quota):(quota?countdown(quota.resetsAt):"未提供")}
function render(s){snapshot=s;$("plan").textContent=s.planType?"Codex "+String(s.planType).replace(/^./,c=>c.toUpperCase()):"Codex";renderQuota("five",s.fiveHour);renderQuota("week",s.weekly);$("dot").className="dot "+(s.running?"running":"");$("tailDot").className="status-orb "+(s.running?"running":"");$("statusTail").title=s.running?"正在运行":"运行完成";$("status").textContent=s.running?"正在运行":"运行完成";$("taskTitle").textContent=s.current?s.current.title:"暂无最近任务";$("model").textContent=s.current&&s.current.model?s.current.model:"";$("tokens").textContent=s.current?compact(s.current.tokensUsed):"";$("updated").textContent=s.current?ago(s.current.updatedAt):"";$("elapsed").textContent=s.running&&s.current?duration(s.current.startedAt):"";$("appState").textContent=(s.codexOpen?"● Codex 已打开":"○ Codex 未打开")+" · 今日 "+compact(s.dailyTokens||0)}
window.codexWidget.onStatus(render);window.codexWidget.getStatus().then(render);
$("close").onclick=()=>window.codexWidget.hide();$("refresh").onclick=()=>window.codexWidget.refresh();$("openCodex").onclick=()=>window.codexWidget.openCodex();$("task").onclick=()=>snapshot&&snapshot.current&&window.codexWidget.openTask(snapshot.current.id);$("weekQuota").addEventListener("mouseenter",()=>window.codexWidget.showTooltip(weeklyTooltip(snapshot)));$("weekQuota").addEventListener("mouseleave",()=>window.codexWidget.hideTooltip());$("fiveQuota").addEventListener("mouseenter",()=>window.codexWidget.showTooltip({title:"后续预测窗口",text:fiveHourDetails(snapshot&&snapshot.fiveHour)}));$("fiveQuota").addEventListener("mouseleave",()=>window.codexWidget.hideTooltip());
setInterval(()=>snapshot&&render(snapshot),1000);
</script>
</body>
</html>
