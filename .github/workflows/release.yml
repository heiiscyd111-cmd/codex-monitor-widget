name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build portable and source packages
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.0.0-test" }
          ./scripts/build-release.ps1 -Version $version
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.txt --generate-notes --title "Codex Monitor ${{ github.ref_name }}"
