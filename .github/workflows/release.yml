name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build portable and source packages
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.0.0-test" }
          ./scripts/build-release.ps1 -Version $version
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CodexMonitor-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

  macos-build:
    strategy:
      matrix:
        include:
          - arch: arm64
            binary_arch: arm64
            runner: macos-15
          - arch: x64
            binary_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build macOS package
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-test' }}
        run: npm run build:mac -- --arch=${{ matrix.arch }} --version="$PACKAGE_VERSION"
      - name: Verify macOS package
        env:
          PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-test' }}
        run: |
          archive="dist/CodexMonitor-$PACKAGE_VERSION-macOS-${{ matrix.arch }}.zip"
          test -f "$archive"
          mac_check_dir=$(mktemp -d)
          ditto -x -k "$archive" "$mac_check_dir"
          app_path=$(find "$mac_check_dir" -type d -name CodexMonitor.app -print -quit)
          file "$app_path/Contents/MacOS/CodexMonitor" | grep -q "${{ matrix.binary_arch }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = "io.github.asusfx80.codex-monitor-widget"
          "$app_path/Contents/MacOS/CodexMonitor" --smoke-test | grep -q "CodexMonitor smoke test passed"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexMonitor-macOS-${{ matrix.arch }}
          path: dist/CodexMonitor-*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs:
      - windows-x64
      - macos-build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: CodexMonitor-*
          path: dist
          merge-multiple: true
      - name: Verify release set and checksums
        run: |
          zip_count=$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          test "$zip_count" = "4"
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.txt --repo "${{ github.repository }}" --generate-notes --title "Codex Monitor ${{ github.ref_name }}"
